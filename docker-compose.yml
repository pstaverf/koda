services:
  postgres:
    image: postgres:17-alpine
    container_name: koda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: koda
      POSTGRES_DB: koda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: koda-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: koda-seaweedfs
    restart: unless-stopped
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data

  seaweedfs-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: koda-seaweedfs-init
    restart: "no"
    depends_on:
      - seaweedfs
    entrypoint:
      - /bin/sh
      - -c
      - until mc alias set koda http://seaweedfs:8333 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing koda/koda; exit 0

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: koda-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  mailpit_data:
